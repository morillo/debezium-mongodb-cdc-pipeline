[project]
name = "debezium-mongodb-cdc-pipeline"
version = "0.1.0"
description = "Metadata-driven Debezium MongoDB CDC framework for Lakeflow Declarative Pipelines"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
