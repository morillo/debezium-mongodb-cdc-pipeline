# CI for the Debezium CDC pipeline bundle.
#
# Pull requests: secret scan + lint + type check + unit tests + bundle
# validation.
# Pushes to main: deploy to test; tags (v*): deploy to prod.
# DATABRICKS_HOST / DATABRICKS_TOKEN come from environment-scoped
# GitHub secrets (use a service principal token, never a user PAT).
# Databricks steps skip gracefully when the secrets are not configured,
# so the workflow stays green on repos without a wired workspace.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the checkout
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check (Pyright, same checks as VS Code Pylance)
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -q

  validate-bundle:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for Databricks credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks secrets not configured;" \
              "skipping bundle validation."
          fi
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        if: steps.creds.outputs.present == 'true'
      - name: Validate bundle
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle validate -t dev

  deploy-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-bundle
    environment: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for Databricks credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks secrets not configured;" \
              "skipping deploy to test."
          fi
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        if: steps.creds.outputs.present == 'true'
      - name: Deploy to test
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle deploy -t test

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: validate-bundle
    environment: prod # gate with required reviewers in GitHub settings
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for Databricks credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks secrets not configured;" \
              "skipping deploy to prod."
          fi
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        if: steps.creds.outputs.present == 'true'
      - name: Deploy to prod
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle deploy -t prod
