# CI for the Debezium CDC pipeline bundle.
#
# Pull requests: lint + unit tests + bundle validation.
# Pushes to main: deploy to test; tags (v*): deploy to prod.
# DATABRICKS_HOST / DATABRICKS_TOKEN come from environment-scoped
# GitHub secrets (use a service principal token, never a user PAT).
# Databricks steps skip gracefully when the secrets are not configured,
# so the workflow stays green on repos without a wired workspace.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q

  validate-bundle:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Databricks credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks secrets not configured;" \
              "skipping bundle validation."
          fi
      - uses: databricks/setup-cli@main
        if: steps.creds.outputs.present == 'true'
      - name: Validate bundle
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle validate -t dev

  deploy-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-bundle
    environment: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Databricks credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks secrets not configured;" \
              "skipping deploy to test."
          fi
      - uses: databricks/setup-cli@main
        if: steps.creds.outputs.present == 'true'
      - name: Deploy to test
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle deploy -t test

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: validate-bundle
    environment: prod # gate with required reviewers in GitHub settings
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Databricks credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks secrets not configured;" \
              "skipping deploy to prod."
          fi
      - uses: databricks/setup-cli@main
        if: steps.creds.outputs.present == 'true'
      - name: Deploy to prod
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle deploy -t prod
